
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Randa Oum Mohamed - Couture Professionnelle</title>

  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #0f0f0f;
      margin: 0;
      padding: 0;
      color: #f2f2f2;
      text-align: center;
    }
    :root {
      --gold: #d4af37;
      --gold-light: #f4e3a2;
      --dark: #111;
    }
    header {
      background: linear-gradient(135deg, #5e0000, #8b0000);
      padding: 35px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      border-bottom: 3px solid var(--gold);
    }
    .logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--gold);
      color: #5e0000;
      font-weight: bold;
      font-size: 1.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 12px #000;
    }
    header h1 {
      margin: 0;
      font-weight: 800;
      font-size: 2.1rem;
      text-transform: uppercase;
      color: var(--gold-light);
    }
    main {
      max-width: 750px;
      margin: 40px auto;
      background-color: #1a1a1a;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 0 20px #5e0000;
    }
    img.main-photo {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    h2.section-title {
      font-size: 1.8rem;
      color: var(--gold);
      margin-top: 40px;
      margin-bottom: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .services-list li {
      margin: 12px 0;
      font-size: 1.15rem;
      color: var(--gold-light);
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 15px;
    }
    .gallery-grid img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 0 10px #300;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">R•M</div>
  <h1>Randa Oum Mohamed</h1>
</header>

<main>

  <img src="photo1.jpg" class="main-photo">

  <h2 class="section-title">Portfolio</h2>
  <div class="gallery-grid">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
  </div>

</main>

<footer>
  © 2024 – Couture Professionnelle Randa Oum Mohamed.
</footer>

</body>
</html>
